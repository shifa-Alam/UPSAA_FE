<!DOCTYPE html>
<html lang="bn" translate="no" class="notranslate">

<head>
  <meta charset="utf-8">
  <title>UPSAA — Uttaran Public School Alumni Association</title>
  <base href="/">
  <!-- viewport-fit=cover lets the installed app draw under the iPhone notch/home bar;
       the layout pads itself with env(safe-area-inset-*). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="google" content="notranslate">
  <meta name="theme-color" content="#0a2a5e">

  <!-- Installable app (PWA): manifest, home-screen icons, iOS standalone mode. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="application-name" content="UPSAA">
  <meta name="apple-mobile-web-app-title" content="UPSAA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <!-- Link previews (Facebook, WhatsApp, Messenger, X). Crawlers don't run JavaScript,
       so these static tags are what every shared link shows. og:image must be an
       absolute URL on the domain that serves THIS app (uttaranalumni.org is still the older
       PHP site, where og-image.png doesn't exist) — update these when the domain moves. -->
  <meta name="description"
    content="উত্তরণ পাবলিক স্কুলের প্রাক্তন শিক্ষার্থীদের ঐক্যবদ্ধ পরিবার — পুনর্মিলনী, ইভেন্ট, অ্যালামনাই তালিকা, ছবি ও আরও অনেক কিছু। Uttaran Public School Alumni Association.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="UPSAA">
  <meta property="og:locale" content="bn_BD">
  <meta property="og:locale:alternate" content="en_US">
  <meta property="og:url" content="https://upsaa-fe.vercel.app/">
  <meta property="og:title" content="UPSAA — Uttaran Public School Alumni Association">
  <meta property="og:description"
    content="একটি স্কুল। অনেক প্রজন্ম। একটি পরিবার। উত্তরণ পাবলিক স্কুল অ্যালামনাই অ্যাসোসিয়েশনে যুক্ত হোন।">
  <meta property="og:image" content="https://upsaa-fe.vercel.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Uttaran Public School Alumni Association — One School. Many Generations. One Community.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="UPSAA — Uttaran Public School Alumni Association">
  <meta name="twitter:image" content="https://upsaa-fe.vercel.app/og-image.png">
  <link rel="icon" type="image/x-icon" href="logo.ico">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&family=Noto+Serif+Bengali:wght@500..800&family=Hind+Siliguri:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script> -->

  <!-- Set the theme before first paint so there's no light->dark flash on load. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('upsaa-theme');
        var theme = saved === 'dark' || saved === 'light'
          ? saved
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { /* storage disabled — default light theme applies */ }
    })();
  </script>

</head>

<body>
  <app-root></app-root>
</body>

</html>
