<div class="auth-page">
  <div class="auth-card">
    <!-- Logo -->
    <div class="auth-card__brand">
      <img src="logo.png" alt="Logo" class="auth-card__logo" />
      <h2 class="auth-card__title">UPS Alumni Association</h2>
      <p class="auth-card__subtitle">Access your alumni dashboard</p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="submit()" class="auth-form">

      <!-- Email -->
      <!-- <div class="input-group">
        <mat-icon>email</mat-icon>
        <input type="email" formControlName="email" placeholder="Email"
          [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" />
      </div>
      <div class="error" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
        <span *ngIf="loginForm.get('email')?.hasError('required')">Email is required</span>
        <span *ngIf="loginForm.get('email')?.hasError('email')">Invalid email</span>
      </div> -->
      <!-- Phone -->
      <div class="auth-field">
        <div class="auth-field__control"
          [class.auth-field__control--invalid]="loginForm.get('phone')?.invalid && loginForm.get('phone')?.touched">
          <mat-icon>account_circle</mat-icon>
          <input type="text" formControlName="phone" placeholder="Email or Phone" />
        </div>

        <div class="auth-field__error" *ngIf="loginForm.get('phone')?.touched && loginForm.get('phone')?.invalid">
          <span *ngIf="loginForm.get('phone')?.hasError('required')">
            Email or Phone is required
          </span>
        </div>
      </div>

      <!-- Password -->
      <div class="auth-field">
        <div class="auth-field__control auth-field__control--password"
          [class.auth-field__control--invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <mat-icon>lock</mat-icon>
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Password" />
          <button type="button" class="auth-field__toggle" (click)="togglePassword()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
            <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
        <div class="auth-field__error"
          *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          Password is required
        </div>
      </div>

      <!-- General error -->
      <div class="auth-field__error auth-field__error--general" *ngIf="errorMessage">{{ errorMessage }}</div>

      <!-- Submit Button -->
      <button type="submit" [disabled]="loading" class="auth-submit">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>

      <!-- Forgot Password -->
      <div class="auth-form__footer">
        <a routerLink="/forgot-password">Forgot your password?</a>
      </div>

    </form>
  </div>
</div>
