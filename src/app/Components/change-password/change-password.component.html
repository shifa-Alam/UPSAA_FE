<h2 mat-dialog-title class="dialog-title">{{ 'changePassword.title' | translate }}</h2>

<mat-dialog-content class="dialog-content">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>{{ 'changePassword.currentPassword' | translate }}</mat-label>
    <input matInput type="password" [(ngModel)]="passwordData.currentPassword" required>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>{{ 'changePassword.newPassword' | translate }}</mat-label>
    <input matInput type="password" [(ngModel)]="passwordData.newPassword" required>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>{{ 'changePassword.confirmPassword' | translate }}</mat-label>
    <input matInput type="password" [(ngModel)]="passwordData.confirmPassword" required>
  </mat-form-field>

  <div *ngIf="passwordError" class="error">{{ passwordError }}</div>
  <div *ngIf="passwordSuccess" class="success">{{ passwordSuccess }}</div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-stroked-button color="warn" (click)="dialogRef.close()" [disabled]="loading">{{ 'changePassword.cancel' | translate }}</button>
  <button mat-raised-button color="primary" class="premium-btn" (click)="changePassword()" [disabled]="loading">
    {{ (loading ? 'changePassword.saving' : 'changePassword.submit') | translate }}
  </button>
</mat-dialog-actions>
