<div class="gallery-admin">

  <app-admin-header [title]="'galleryAdmin.title' | translate" [subtitle]="'galleryAdmin.subtitle' | translate"></app-admin-header>

  <!-- ===== Upload ===== -->
  <app-section-card icon="cloud_upload" [title]="'galleryAdmin.uploadCardTitle' | translate">
    <form class="upload-form" (ngSubmit)="submit()">
      <div class="dropzone" [class.dropzone--filled]="!!previewUrl">
        <input type="file" id="galleryFile" accept="image/*" (change)="onFileSelected($event)"
          [attr.aria-label]="'galleryAdmin.chooseImage' | translate" />
        <label for="galleryFile" class="dropzone__empty" *ngIf="!previewUrl">
          <span class="dropzone__icon"><mat-icon>add_photo_alternate</mat-icon></span>
          <span class="dropzone__title">{{ 'galleryAdmin.chooseImage' | translate }}</span>
          <span class="dropzone__hint">{{ 'galleryAdmin.chooseImageHint' | translate }}</span>
        </label>
        <label for="galleryFile" class="dropzone__preview" *ngIf="previewUrl">
          <img [src]="previewUrl" alt="Preview" />
          <span class="dropzone__change">
            <mat-icon>photo_camera</mat-icon>
            {{ 'galleryAdmin.replaceImage' | translate }}
          </span>
        </label>
      </div>

      <div class="upload-form__fields">
        <div class="form-field">
          <label for="galleryTitle">{{ 'galleryAdmin.titleLabel' | translate }}</label>
          <input type="text" id="galleryTitle" [placeholder]="'galleryAdmin.titlePlaceholder' | translate" [(ngModel)]="title" name="title" />
        </div>

        <div class="form-field">
          <label for="galleryCategory">{{ 'galleryAdmin.categoryLabel' | translate }}</label>
          <input type="text" id="galleryCategory" [placeholder]="'galleryAdmin.categoryPlaceholder' | translate" [(ngModel)]="category" name="category"
            list="categoryOptions" />
          <datalist id="categoryOptions">
            <option *ngFor="let cat of categories" [value]="cat"></option>
          </datalist>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn--solid" [disabled]="uploading">
            <mat-icon>{{ uploading ? 'hourglass_top' : 'upload' }}</mat-icon>
            {{ uploading ? ('galleryAdmin.uploading' | translate) : ('galleryAdmin.uploadButton' | translate) }}
          </button>
        </div>
      </div>
    </form>
  </app-section-card>

  <!-- ===== Library ===== -->
  <app-section-card icon="photo_library" [title]="'galleryAdmin.uploadedCardTitle' | translate" [noPadding]="true">

    <div class="toolbar" *ngIf="!loading && images.length > 0">
      <div class="filters" role="group" [attr.aria-label]="'galleryAdmin.filterAriaLabel' | translate">
        <button type="button" class="filter" [class.filter--active]="isCategoryActive(null)"
          [attr.aria-pressed]="isCategoryActive(null)" (click)="setCategory(null)">
          {{ 'galleryAdmin.filterAll' | translate }}
          <span class="filter__count">{{ images.length }}</span>
        </button>
        <button type="button" class="filter" *ngFor="let cat of imageCategories"
          [class.filter--active]="isCategoryActive(cat)" [attr.aria-pressed]="isCategoryActive(cat)" (click)="setCategory(cat)">
          {{ cat }}
          <span class="filter__count">{{ countFor(cat) }}</span>
        </button>
      </div>
    </div>

    <div class="loading" role="status" *ngIf="loading">
      <mat-icon>autorenew</mat-icon>
      <span>{{ 'galleryAdmin.loading' | translate }}</span>
    </div>

    <app-empty-state *ngIf="!loading && images.length === 0" icon="photo_library" [title]="'galleryAdmin.emptyTitle' | translate"
      [message]="'galleryAdmin.emptyMessage' | translate"></app-empty-state>

    <div class="grid" *ngIf="!loading && images.length > 0">
      <article class="tile" *ngFor="let image of visibleImages" [class.tile--editing]="editingId === image.id">

        <!-- View mode -->
        <ng-container *ngIf="editingId !== image.id">
          <div class="tile__media">
            <img [src]="image.imageUrl" [alt]="image.title" loading="lazy" />
            <span class="tile__category" *ngIf="image.category">{{ image.category }}</span>
            <div class="tile__actions">
              <button type="button" class="tile__action" (click)="startEdit(image)"
                [attr.aria-label]="'galleryAdmin.editAriaLabel' | translate" [attr.title]="'galleryAdmin.editAriaLabel' | translate">
                <mat-icon>edit</mat-icon>
              </button>
              <button type="button" class="tile__action tile__action--danger"
                [disabled]="deletingId === image.id" (click)="confirmDelete(image)"
                [attr.aria-label]="'galleryAdmin.deleteAriaLabel' | translate" [attr.title]="'galleryAdmin.deleteAriaLabel' | translate">
                <mat-icon>{{ deletingId === image.id ? 'hourglass_top' : 'delete' }}</mat-icon>
              </button>
            </div>
          </div>
          <div class="tile__body">
            <strong class="tile__title" [attr.title]="image.title">{{ image.title }}</strong>
            <span *ngIf="image.createdByName" class="tile__meta">{{ 'galleryAdmin.uploadedBy' | translate }} {{ image.createdByName }}</span>
          </div>
        </ng-container>

        <!-- Edit mode -->
        <div class="tile__edit" *ngIf="editingId === image.id">
          <label class="edit-photo" for="editFile-{{ image.id }}">
            <img [src]="editPreviewUrl || image.imageUrl" [alt]="image.title" />
            <span class="edit-photo__hint">
              <mat-icon>photo_camera</mat-icon>
              {{ 'galleryAdmin.replaceImage' | translate }}
            </span>
            <input type="file" id="editFile-{{ image.id }}" accept="image/*" (change)="onEditFileSelected($event)" />
          </label>

          <div class="form-field">
            <label for="editTitle-{{ image.id }}">{{ 'galleryAdmin.titleLabel' | translate }}</label>
            <input type="text" id="editTitle-{{ image.id }}" [(ngModel)]="editTitle" name="editTitle-{{ image.id }}" />
          </div>
          <div class="form-field">
            <label for="editCategory-{{ image.id }}">{{ 'galleryAdmin.categoryLabel' | translate }}</label>
            <input type="text" id="editCategory-{{ image.id }}" [(ngModel)]="editCategory" name="editCategory-{{ image.id }}" list="categoryOptions" />
          </div>

          <div class="tile__edit-actions">
            <button type="button" class="btn btn--solid btn--sm" [disabled]="saving" (click)="submitEdit(image)">
              <mat-icon>{{ saving ? 'hourglass_top' : 'check' }}</mat-icon>
              {{ 'galleryAdmin.saveButton' | translate }}
            </button>
            <button type="button" class="btn btn--outline btn--sm" [disabled]="saving" (click)="cancelEdit()">
              {{ 'galleryAdmin.cancelButton' | translate }}
            </button>
          </div>
        </div>

      </article>
    </div>
  </app-section-card>

</div>
