<div class="auth-page">
  <div class="auth-card">

    <!-- Success Message -->
    <div *ngIf="step === 4" class="auth-success">
      <h2>Password Reset Successful ✅</h2>
      <p>Your password has been updated successfully.</p>
      <a class="auth-submit auth-submit--link" routerLink="/login">Go to Login</a>
    </div>

    <!-- Steps 1-3 -->
    <ng-container *ngIf="step < 4">

      <h2 class="auth-card__title">Forgot Password</h2>

      <!-- Step Progress Bar -->
      <div class="auth-steps">
        <div class="auth-steps__dot" [class.auth-steps__dot--active]="step >= 1">1</div>
        <div class="auth-steps__dot" [class.auth-steps__dot--active]="step >= 2">2</div>
        <div class="auth-steps__dot" [class.auth-steps__dot--active]="step >= 3">3</div>
      </div>

      <div class="auth-steps__label">
        Step {{ step }} of 3
      </div>

      <!-- Step 1: Phone + Batch -->
      <div *ngIf="step === 1" class="auth-form">
        <input type="text" [(ngModel)]="phoneNumber" placeholder="Registered Phone Number" class="auth-input" />
        <select [(ngModel)]="batch" class="auth-input">
          <option value="">Select Your Batch</option>
          <option *ngFor="let year of batchYears" [value]="year">{{ year }}</option>
        </select>
        <button class="auth-submit" (click)="sendOtp()" [disabled]="!phoneNumber || !batch || loading">
          {{ loading ? 'Sending...' : 'Send OTP' }}
        </button>
      </div>

      <!-- Step 2: OTP Verification -->
      <div *ngIf="step === 2" class="auth-form">
        <input type="text" maxlength="6" [(ngModel)]="otp" placeholder="Enter 6-digit OTP" class="auth-input" />
        <button class="auth-submit" (click)="verifyOtp()" [disabled]="otp.length !== 6 || loading">
          {{ loading ? 'Verifying...' : 'Verify OTP' }}
        </button>

        <div *ngIf="otpCountdown > 0" class="auth-steps__countdown">
          Resend OTP in {{ otpCountdown }}s
        </div>
        <button *ngIf="otpCountdown <= 0" class="auth-form__link-btn" (click)="resendOtp()">Resend OTP</button>
      </div>

      <!-- Step 3: Reset Password -->
      <div *ngIf="step === 3" class="auth-form">
        <input type="password" [(ngModel)]="newPassword" placeholder="New Password" class="auth-input" />
        <input type="password" [(ngModel)]="confirmPassword" placeholder="Confirm Password" class="auth-input" />
        <button class="auth-submit" (click)="resetPassword()"
          [disabled]="!newPassword || newPassword !== confirmPassword || loading">
          {{ loading ? 'Resetting...' : 'Reset Password' }}
        </button>
      </div>

      <!-- Error / Info Message -->
      <p class="auth-message" [class.auth-message--error]="isError">{{ message }}</p>

    </ng-container>

  </div>
</div>
