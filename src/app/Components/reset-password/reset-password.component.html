<div class="auth">

  <!-- Brand panel -->
  <aside class="auth__brand">
    <div class="auth__brand-inner">
      <img src="logo.png" alt="UPSAA" class="auth__logo" />
      <span class="auth__eyebrow">{{ 'resetPassword.brand.eyebrow' | translate }}</span>
      <h1 class="auth__title">{{ 'resetPassword.brand.title' | translate }}</h1>
      <span class="auth__rule"></span>
      <p class="auth__tagline">{{ 'resetPassword.brand.tagline' | translate }}</p>
    </div>
  </aside>

  <main class="auth__main">
    <div class="auth-card">
      <header class="auth-card__head">
        <h2 class="auth-card__title">{{ 'resetPassword.title' | translate }}</h2>
        <p class="auth-card__subtitle">{{ 'resetPassword.subtitle' | translate }}</p>
      </header>

      <form (ngSubmit)="onSubmit()" class="auth-form">
        <div class="auth-field">
          <div class="auth-field__control">
            <mat-icon>lock</mat-icon>
            <input
              type="password"
              [(ngModel)]="newPassword"
              name="newPassword"
              autocomplete="new-password"
              [placeholder]="'resetPassword.newPasswordPlaceholder' | translate"
              [attr.aria-label]="'resetPassword.newPasswordPlaceholder' | translate"
              required
            />
          </div>
        </div>

        <button type="submit" class="pp-btn pp-btn--solid auth-submit">{{ 'resetPassword.changePassword' | translate }}</button>
      </form>

      <p class="auth-message" *ngIf="message" role="status"
        [class.auth-message--success]="isSuccess" [class.auth-message--error]="!isSuccess">{{ message }}</p>

      <footer class="auth-card__footer">
        <a routerLink="/login" class="auth-card__link">{{ 'resetPassword.backToLogin' | translate }}</a>
      </footer>
    </div>
  </main>
</div>
