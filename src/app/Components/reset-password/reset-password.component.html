<div class="auth-page">
  <div class="auth-card">
    <h2 class="auth-card__title">Reset Your Password</h2>

    <p class="auth-card__subtitle">
      Enter a new password for your alumni account.
    </p>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="auth-field">
        <input
          type="password"
          [(ngModel)]="newPassword"
          name="newPassword"
          placeholder="New Password"
          required
          class="auth-input"
        />
      </div>

      <button type="submit" class="auth-submit">Reset Password</button>
    </form>

    <p class="auth-message" [class.auth-message--success]="isSuccess" [class.auth-message--error]="!isSuccess">{{ message }}</p>
  </div>
</div>
