<section class="section-card">
  <header class="section-card__head" *ngIf="title">
    <mat-icon *ngIf="icon" class="section-card__icon">{{ icon }}</mat-icon>
    <div>
      <h2 class="section-card__title">{{ title }}</h2>
      <p class="section-card__subtitle" *ngIf="subtitle">{{ subtitle }}</p>
    </div>
  </header>
  <div class="section-card__body" [class.section-card__body--flush]="noPadding">
    <ng-content></ng-content>
  </div>
</section>
