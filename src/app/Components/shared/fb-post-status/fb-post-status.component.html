<ng-container *ngIf="!disabled">
  <!-- Posted -->
  <ng-container *ngIf="item.facebookPostId; else notPosted">
    <a *ngIf="postUrl; else postedText" class="fbs fbs--posted" [href]="postUrl" target="_blank" rel="noopener">
      <svg class="fbs__logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></svg>
      {{ 'facebookPage.posted' | translate }}<mat-icon>open_in_new</mat-icon>
    </a>
    <ng-template #postedText>
      <span class="fbs fbs--posted">
        <svg class="fbs__logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></svg>
        {{ 'facebookPage.posted' | translate }}
      </span>
    </ng-template>
  </ng-container>

  <!-- Not posted yet -->
  <ng-template #notPosted>
    <span class="fbs fbs--waiting" *ngIf="waiting">
      <mat-icon>schedule</mat-icon>{{ 'facebookPage.pending' | translate }}
    </span>
    <span class="fbs fbs--failed" *ngIf="item.facebookError" [attr.title]="item.facebookError">
      <mat-icon>error_outline</mat-icon>{{ 'facebookPage.failed' | translate }}
    </span>
    <button type="button" class="fbs fbs--action" [disabled]="busy" (click)="postNow()">
      <svg class="fbs__logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></svg>
      {{ (busy ? 'facebookPage.posting' : item.facebookError ? 'facebookPage.retry' : 'facebookPage.postNow') | translate }}
    </button>
    <span class="fbs__error" *ngIf="item.facebookError">{{ item.facebookError }}</span>
  </ng-template>
</ng-container>
