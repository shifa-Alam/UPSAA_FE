<header class="page-header" [class.page-header--plain]="variant === 'plain'">
  <div class="upsaa-container page-header__inner">
    <span class="page-header__eyebrow" *ngIf="eyebrow">{{ eyebrow }}</span>
    <h1 class="page-header__title">{{ title }}</h1>
    <p class="page-header__subtitle" *ngIf="subtitle">{{ subtitle }}</p>
    <div class="page-header__extra">
      <ng-content></ng-content>
    </div>
  </div>
</header>
