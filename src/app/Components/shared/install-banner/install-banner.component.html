<aside class="install-card" *ngIf="visible()" role="dialog" aria-live="polite"
  [attr.aria-label]="(iosHint() ? 'pwa.install.iosTitle' : 'pwa.install.title') | translate">
  <img class="install-card__icon" src="icons/icon-192.png" alt="" width="44" height="44" />

  <div class="install-card__body">
    <strong class="install-card__title">{{ (iosHint() ? 'pwa.install.iosTitle' : 'pwa.install.title') | translate }}</strong>
    <p class="install-card__text" *ngIf="!iosHint()">{{ 'pwa.install.text' | translate }}</p>
    <p class="install-card__text" *ngIf="iosHint()">
      <mat-icon class="install-card__share" aria-hidden="true">ios_share</mat-icon>
      {{ 'pwa.install.iosText' | translate }}
    </p>
  </div>

  <div class="install-card__actions" *ngIf="!iosHint()">
    <button type="button" class="install-card__btn install-card__btn--ghost" (click)="dismiss()">
      {{ 'pwa.install.dismiss' | translate }}
    </button>
    <button type="button" class="install-card__btn" (click)="install()">
      {{ 'pwa.install.action' | translate }}
    </button>
  </div>

  <button type="button" class="install-card__close" *ngIf="iosHint()" (click)="dismiss()"
    [attr.aria-label]="'pwa.install.close' | translate">
    <mat-icon>close</mat-icon>
  </button>
</aside>
